<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ADMA Finance">
  <meta name="theme-color" content="#f8fafc">
  <title>ADMA Finance</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=28">
  <link rel="stylesheet" href="design-system.css?v=31">
</head>
<body data-locked="loading">
  <header class="topbar">
    <div class="brand"><strong>ADMA</strong><span>FINANCE</span></div>
    <span class="workspace-badge">Рабочее пространство</span>
    <h1 id="title">Главная</h1>
    <div class="header-user"><span id="headerName">ADMA</span><span id="headerAvatar">A</span></div>
  </header>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-label">РАБОЧЕЕ ПРОСТРАНСТВО</div>
      <nav class="side-nav">
        <button class="side-tab active" data-side-tab="home"><span>⌂</span><b>Главная</b></button>
        <button class="side-tab" data-side-tab="projects"><span>▦</span><b>Объекты</b><em id="sideProjectCount">0</em></button>
        <button class="side-tab" data-side-tab="finance"><span>₽</span><b>Финансы</b></button>
        <button class="side-tab" data-side-tab="leads"><span>◇</span><b>Заявки</b></button>
        <button class="side-tab" data-side-tab="designers"><span>✦</span><b>Дизайнеры</b></button>
        <button class="side-tab" data-side-tab="masters"><span>◎</span><b>Мастера</b></button>
        <button class="side-tab" data-side-tab="knowledge"><span>▤</span><b>База знаний</b></button>
      </nav>
      <div class="sidebar-label projects-label">АКТИВНЫЕ ОБЪЕКТЫ</div>
      <div id="sideProjects" class="side-projects"></div>
      <div class="sidebar-footer"><strong>Финансы под контролем</strong><span>От объекта до последнего платежа</span></div>
    </aside>
    <main id="app" class="content"></main>
  </div>
  <button id="fab" class="fab">＋</button>
  <nav class="tabs" aria-label="Основная навигация">
    <button class="tab active" data-tab="home"><span>⌂</span><small>Главная</small></button>
    <button class="tab" data-tab="projects"><span>▦</span><small>Объекты</small></button>
    <button class="tab" data-tab="finance"><span>₽</span><small>Финансы</small></button>
    <button class="tab" data-tab="leads"><span>◇</span><small>Заявки</small></button>
    <button class="tab" data-tab="more"><span>•••</span><small>Ещё</small></button>
  </nav>
  <dialog id="projectDlg">
    <form id="projectForm">
      <div class="sheethead"><button type="button" onclick="projectDlg.close()">Отмена</button><h2>Новый объект</h2><button class="btn primary">Сохранить</button></div>
      <label>Название ЖК / объекта<input id="pName" required maxlength="160" placeholder="ЖК Lucky"></label>
      <label>Статус<select id="pStatus"><option value="preparation">Подготовка</option><option value="in_progress">В работе</option><option value="paused">Приостановлен</option><option value="handover">Сдача</option><option value="warranty">Гарантия</option><option value="archived" disabled>Архив</option></select></label>
      <label>Адрес<input id="pAddress" maxlength="300" placeholder="Москва"></label>
      <div class="grid"><label>Площадь, м²<input id="pArea" type="number" inputmode="decimal" min="1" max="10000" step="0.01"></label><label>Номер договора<input id="pContract" maxlength="100"></label></div>
      <label>Сумма договора, ₽<input id="pContractAmount" type="number" inputmode="decimal" min="0.01" max="999999999999.99" step="0.01"></label>
      <label>Заказчик<input id="pClient" maxlength="160"></label>
      <label>Телефон заказчика<input id="pClientPhone" type="tel" maxlength="40" autocomplete="tel"></label>
      <label>Дизайнер<select id="pDesigner"><option value="">Не назначен</option></select></label>
      <div class="grid"><label>Дата начала<input id="pStartDate" type="date"></label><label>Плановая сдача<input id="pPlannedEndDate" type="date"></label></div>
      <div class="grid"><label>Фактическая сдача<input id="pActualEndDate" type="date"></label><label>Гарантия до<input id="pWarrantyUntil" type="date"></label></div>
      <label>Примечания<textarea id="pComment" rows="3" maxlength="2000"></textarea></label>
    </form>
  </dialog>
  <dialog id="expenseDlg">
    <form id="expenseForm">
      <div class="sheethead"><button type="button" onclick="expenseDlg.close()">Отмена</button><h2>Новый расход</h2><button class="btn primary">Сохранить</button></div>
      <label>Объект<select id="eProject" required></select></label>
      <label>Сумма, ₽<input id="eAmount" type="number" inputmode="decimal" min="0" step="0.01" required></label>
      <div class="grid"><label>Дата<input id="eDate" type="date" required></label><label>Категория<select id="eCategory"></select></label></div>
      <label>Поставщик<input id="eSupplier" placeholder="Петрович"></label>
      <label>Кто оплатил<select id="ePaidBy"><option value="adma">ADMA</option><option value="client">Заказчик</option></select></label>
      <label class="switch" id="reimbRow"><span>Заказчик должен компенсировать</span><input id="eReimburse" type="checkbox" checked></label>
      <label>Комментарий<textarea id="eComment" rows="3"></textarea></label>
      <label>Фото чека<input id="eReceipt" type="file" accept="image/*"></label>
      <img id="preview" class="receipt" style="display:none">
    </form>
  </dialog>
  <dialog id="stageDlg">
    <form id="stageForm">
      <input id="sId" type="hidden">
      <div class="sheethead"><button id="cancelStage" type="button">Отмена</button><h2>Новый этап</h2><button class="btn primary">Сохранить</button></div>
      <label>Название этапа<input id="sName" required maxlength="160" placeholder="Электрика"></label>
      <div class="grid"><label>Статус<select id="sStatus"><option value="planned">Запланирован</option><option value="in_progress">В работе</option><option value="completed">Выполнен</option><option value="delayed">Задерживается</option><option value="paused">Приостановлен</option></select></label><label>Готовность, %<input id="sProgress" type="number" inputmode="numeric" min="0" max="100" step="1" value="0" required></label></div>
      <div class="grid"><label>Плановое начало<input id="sPlannedStart" type="date"></label><label>Плановое окончание<input id="sPlannedEnd" type="date"></label></div>
      <div class="grid"><label>Фактическое начало<input id="sActualStart" type="date"></label><label>Фактическое окончание<input id="sActualEnd" type="date"></label></div>
      <label>Стоимость работ, ₽<input id="sWorkCost" type="number" inputmode="decimal" min="0" step="0.01"></label>
      <label>Комментарий<textarea id="sComment" rows="3" maxlength="2000"></textarea></label>
      <button id="deleteStage" class="btn danger full-button" type="button" hidden>Удалить этап</button>
    </form>
  </dialog>
  <dialog id="detailDlg"><div id="detail" class="dialog-body"></div></dialog>
  <script src="auth.js?v=23"></script>
  <script src="app.js?v=23"></script>
  <script src="cloud.js?v=33"></script>
</body>
</html>
