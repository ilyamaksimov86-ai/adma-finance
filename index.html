<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f6f6f8"><title>ADMA Finance</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--bg:#f6f6f8;--card:#fff;--text:#17171a;--muted:#777781;--border:#e7e7ec;--red:#e5484d;--green:#2c9b63}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none;touch-action:manipulation}body{-webkit-user-select:none;user-select:none}input,textarea,select{-webkit-user-select:text;user-select:text}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;padding-bottom:92px}header{position:sticky;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;background:rgba(246,246,248,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}header b{font-size:12px;letter-spacing:2px}h1{font-size:28px;margin:2px 0}.content{padding:14px 16px;max-width:760px;margin:auto}.hero{background:#111;color:white;padding:22px;border-radius:26px;margin-bottom:12px}.hero small{opacity:.65}.amount{font-size:40px;font-weight:800;margin:7px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:10px}.metric small,.muted{color:var(--muted)}.metric strong{display:block;font-size:22px;margin-top:6px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.right{text-align:right}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.pending{background:#fff0e2;color:#ad6213}.paid{background:#e8f6ee;color:#277b53}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section h2{margin:0;font-size:20px}button{font:inherit;border:0}.btn{padding:11px 14 pt>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes?.()}catch{};try{tg.setHeaderColor?.('#f6f6f8')}catch{};try{tg.setBackgroundColor?.('#f6f6f8')}catch{}}document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});const cats=['Черновые материалы','Чистовые материалы','Электрика','Сантехника','Доставка','Вывоз мусора','Инструмент','Мебель','Работа подрядчиков','Допработы','Прочее'];const state={tab:'home',project:null,receipt:null,projects:JSON.parse(localStorage.getItem('adma.projects')||'[]'),expenses:JSON.parse(localStorage.getItem('adma.expenses')||'[]')};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(+n||0),save=()=>{localStorage.setItem('adma.projects',JSON.stringify(state.projects));localStorage.setItem('adma.expenses',JSON.stringify(state.expenses))},id=()=>crypto.randomUUID?.()||Date.now()+''+Math.random(),proj=i=>state.projects.find(p=>p.id===i),pending=e=>e.paidBy==='adma'&&e.reimburse&&!e.reimbursed,expensesFor=i=>state.expenses.filter(e=>e.projectId===i),sum=(arr)=>arr.reduce((a,e)=>a+(+e.amount||0),0),due=i=>sum(state.expenses.filter(e=>(!i||e.projectId===i)&&pending(e))),spent=i=>sum(state.expenses.filter(e=>!i||e.projectId===i)),reimb=i=>sum(state.expenses.filter(e=>(!i||e.projectId===i)&&e.reimbursed)),fmt=d=>new Intl.DateTimeFormat('ru-RU').format(new Date(d+'T12:00:00')),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));$('#title').textContent=state.project?proj(state.project)?.name||'Объект':({home:'Финансы',projects:'Объекты',due:'К оплате',more:'Ещё'})[state.tab];state.project?renderProject():state.tab==='home'?renderHome():state.tab==='projects'?renderProjects():state.tab==='due'?renderDue():renderMore()}function renderHome(){const m=new Date().toISOString().slice(0,7),month=sum(state.expenses.filter(e=>e.date.startsWith(m))),recent=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);$('#app').innerHTML=`<section class="hero"><small>Заказчики должны ADMA</small><div class="amount">${money(due())}</div><small>${state.expenses.filter(pending).length} расходов к возмещению</small></section><section class="grid"><div class="card metric"><small>Активные объекты</small><strong>${state.projects.length}</strong></div><div class="card metric"><small>Расходы за месяц</small><strong>${money(month)}</strong></div><div class="card metric"><small>Всего расходов</small><strong>${money(spent())}</strong></div><div class="card metric"><small>Компенсировано</small><strong>${money(reimb())}</strong></div></section><div class="section"><h2>Последние расходы</h2></div><div id="list"></div>`;renderExpenses(recent,$('#list'))}function renderProjects(){$('#app').innerHTML=`<div class="section"><h2>Все объекты</h2><button id="addProject" class="btn primary">+ Объект</button></div><div id="plist"></div>`;$('#addProject').onclick=()=>{projectForm.reset();projectDlg.showModal()};const l=$('#plist');if(!state.projects.length)return l.innerHTML='<div class="empty">Создай первый объект</div>';state.projects.forEach(p=>{const b=document.createElement('button');b.className='card row';b.style.width='100%';b.innerHTML=`<div class="grow"><strong>${esc(p.name)}</strong><div class="muted">${expensesFor(p.id).length} расходов · ${money(spent(p.id))}</div></div><div class="right"><strong>${money(due(p.id))}</strong><div class="muted">к оплате</div></div>`;b.onclick=()=>{state.project=p.id;render()};l.appendChild(b)})}function renderProject(){const p=proj(state.project),arr=[...expensesFor(p.id)].sort((a,b)=>b.date.localeCompare(a.date));$('#app').innerHTML=`<button id="back" class="btn secondary">‹ Назад</button><section class="hero" style="margin-top:12px"><small>К возмещению по объекту</small><div class="amount">${money(due(p.id))}</div><small>${esc(p.address||p.client||'')}</small></section><section class="grid"><div class="card metric"><small>Всего расходов</small><strong>${money(spent(p.id))}</strong></div><div class="card metric"><small>Компенсировано</small><strong>${money(reimb(p.id))}</strong></div></section><div class="section"><h2>Расходы</h2><button id="addExpense" class="btn primary">+ Расход</button></div><div id="list"></div>`;$('#back').onclick=()=>{state.project=null;state.tab='projects';render()};$('#addExpense').onclick=()=>openExpense(p.id);renderExpenses(arr,$('#list'))}function renderDue(){const arr=state.expenses.filter(pending).sort((a,b)=>b.date.localeCompare(a.date));$('#app').innerHTML=`<section class="hero"><small>Всего к возмещению</small><div class="amount">${money(due())}</div><small>${arr.length} чеков</small></section><div id="list"></div>`;renderExpenses(arr,$('#list'))}function renderMore(){$('#app').innerHTML=`<div class="card"><strong>ADMA Finance v0.1</strong><p class="muted">Первая версия: объекты, расходы, фото чеков и контроль возмещения.</p></div><div class="card"><strong>Хранение</strong><p class="muted">Сейчас данные сохраняются локально на этом устройстве. Облачную синхронизацию подключим следующей версией.</p></div><div class="card"><button id="reset" class="btn danger">Очистить тестовые данные</button></div>`;$('#reset').onclick=()=>{if(confirm('Удалить все данные?')){state.projects=[];state.expenses=[];save();render()}}}function renderExpenses(arr,l){if(!arr.length){l.innerHTML='<div class="empty">Пока нет расходов</div>';return}arr.forEach(e=>{const p=proj(e.projectId),b=document.createElement('button');b.className='card row';b.style.width='100%';b.innerHTML=`<div class="grow"><strong>${esc(e.supplier||e.category)}</strong><div class="muted">${esc(p?.name||'')} · ${fmt(e.date)}</div><span class="badge ${pending(e)?'pending':'paid'}">${pending(e)?'К возмещению':e.reimbursed?'Компенсировано':'Закрыто'}</span></div><strong>${money(e.amount)}</strong>`;b.onclick=()=>details(e.id);l.appendChild(b)})}let editingExpenseId=null;function openExpense(pid){editingExpenseId=null;if(!state.projects.length){alert('Сначала создай объект');state.tab='projects';render();return}expenseForm.reset();eProject.innerHTML=state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');eCategory.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');eDate.value=new Date().toISOString().slice(0,10);if(pid)eProject.value=pid;eReimburse.checked=true;reimbRow.style.display='flex';state.receipt=null;preview.style.display='none';expenseDlg.showModal()}ePaidBy.onchange=()=>{reimbRow.style.display=ePaidBy.value==='adma'?'flex':'none';if(ePaidBy.value!=='adma')eReimburse.checked=false};eReceipt.onchange=async()=>{const f=eReceipt.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.receipt=r.result;preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)};projectForm.onsubmit=e=>{e.preventDefault();state.projects.push({id:id(),name:pName.value.trim(),address:pAddress.value.trim(),client:pClient.value.trim(),comment:pComment.value.trim()});save();projectDlg.close();render()};expenseForm.onsubmit=e=>{e.preventDefault();const data={projectId:eProject.value,amount:+eAmount.value,date:eDate.value,category:eCategory.value,supplier:eSupplier.value.trim(),paidBy:ePaidBy.value,reimburse:ePaidBy.value==='adma'&&eReimburse.checked,comment:eComment.value.trim(),receipt:state.receipt};if(editingExpenseId){const ex=state.expenses.find(x=>x.id===editingExpenseId);if(ex){Object.assign(ex,data);if(!ex.reimburse)ex.reimbursed=false}}else{state.expenses.push({id:id(),...data,reimbursed:false})}editingExpenseId=null;save();expenseDlg.close();render()};function editExpense(i){const e=state.expenses.find(x=>x.id===i);if(!e)return;editingExpenseId=i;expenseForm.reset();eProject.innerHTML=state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');eCategory.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');eProject.value=e.projectId;eAmount.value=e.amount;eDate.value=e.date;eCategory.value=e.category;eSupplier.value=e.supplier||'';ePaidBy.value=e.paidBy;eReimburse.checked=!!e.reimburse;reimbRow.style.display=e.paidBy==='adma'?'flex':'none';eComment.value=e.comment||'';state.receipt=e.receipt||null;if(e.receipt){preview.src=e.receipt;preview.style.display='block'}else{preview.style.display='none'}detailDlg.close();expenseDlg.showModal()};function details(i){const e=state.expenses.find(x=>x.id===i),p=proj(e.projectId);detail.innerHTML=`<div class="sheethead"><button id="closeDetail">Закрыть</button><h2>Расход</h2><span></span></div><div class="amount">${money(e.amount)}</div><p>${pending(e)?'<span class="badge pending">К возмещению</span>':e.reimbursed?'<span class="badge paid">Компенсировано</span>':'<span class="badge paid">Закрыто</span>'}</p><div class="card"><div><small class="muted">Объект</small><br><strong>${esc(p?.name)}</strong></div><p><small class="muted">Дата</small><br>${fmt(e.date)}</p><p><small class="muted">Поставщик</small><br>${esc(e.supplier||'—')}</p><p><small class="muted">Категория</small><br>${esc(e.category)}</p></div>${e.comment?`<div class="card">${esc(e.comment)}</div>`:''}${e.receipt?`<img class="receipt" src="${e.receipt}">`:''}<div class="row" style="margin-top:12px"><button id="editExpenseBtn" class="btn secondary grow">Редактировать</button>${pending(e)?'<button id="markPaid" class="btn primary grow">Компенсировано</button>':''}<button id="del" class="btn danger">Удалить</button></div>`;closeDetail.onclick=()=>detailDlg.close();editExpenseBtn.onclick=()=>editExpense(i);if($('#markPaid'))markPaid.onclick=()=>{e.reimbursed=true;save();detailDlg.close();render()};del.onclick=()=>{if(confirm('Удалить расход?')){state.expenses=state.expenses.filter(x=>x.id!==i);save();detailDlg.close();render()}};detailDlg.showModal()}$$('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.project=null;render()});fab.onclick=()=>openExpense(state.project);render();</script><script src="cloud.js?v=12"></script></body></html>
