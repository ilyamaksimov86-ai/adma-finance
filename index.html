<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ADMA Finance">
  <meta name="theme-color" content="#f6f6f8">
  <title>ADMA Finance</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=20">
</head>
<body data-locked="loading">
  <header><b>ADMA</b><h1 id="title">Финансы</h1></header>
  <main id="app" class="content"></main>
  <button id="fab" class="fab">＋</button>
  <nav class="tabs">
    <button class="tab active" data-tab="home"><span>⌂</span><small>Главная</small></button>
    <button class="tab" data-tab="projects"><span>▦</span><small>Объекты</small></button>
    <button class="tab" data-tab="due"><span>₽</span><small>К оплате</small></button>
    <button class="tab" data-tab="more"><span>•••</span><small>Ещё</small></button>
  </nav>
  <dialog id="projectDlg">
    <form id="projectForm">
      <div class="sheethead"><button type="button" onclick="projectDlg.close()">Отмена</button><h2>Новый объект</h2><button class="btn primary">Сохранить</button></div>
      <label>Название ЖК / объекта<input id="pName" required maxlength="160" placeholder="ЖК Lucky"></label>
      <label>Статус<select id="pStatus"><option value="preparation">Подготовка</option><option value="in_progress">В работе</option><option value="paused">Приостановлен</option><option value="handover">Сдача</option><option value="warranty">Гарантия</option><option value="archived" disabled>Архив</option></select></label>
      <label>Адрес<input id="pAddress" maxlength="300" placeholder="Москва"></label>
      <div class="grid"><label>Площадь, м²<input id="pArea" type="number" inputmode="decimal" min="1" max="10000" step="0.01"></label><label>Номер договора<input id="pContract" maxlength="100"></label></div>
      <label>Заказчик<input id="pClient" maxlength="160"></label>
      <label>Телефон заказчика<input id="pClientPhone" type="tel" maxlength="40" autocomplete="tel"></label>
      <div class="grid"><label>Дата начала<input id="pStartDate" type="date"></label><label>Плановая сдача<input id="pPlannedEndDate" type="date"></label></div>
      <div class="grid"><label>Фактическая сдача<input id="pActualEndDate" type="date"></label><label>Гарантия до<input id="pWarrantyUntil" type="date"></label></div>
      <label>Примечания<textarea id="pComment" rows="3" maxlength="2000"></textarea></label>
    </form>
  </dialog>
  <dialog id="expenseDlg">
    <form id="expenseForm">
      <div class="sheethead"><button type="button" onclick="expenseDlg.close()">Отмена</button><h2>Новый расход</h2><button class="btn primary">Сохранить</button></div>
      <label>Объект<select id="eProject" required></select></label>
      <label>Сумма, ₽<input id="eAmount" type="number" inputmode="decimal" min="0" step="0.01" required></label>
      <div class="grid"><label>Дата<input id="eDate" type="date" required></label><label>Категория<select id="eCategory"></select></label></div>
      <label>Поставщик<input id="eSupplier" placeholder="Петрович"></label>
      <label>Кто оплатил<select id="ePaidBy"><option value="adma">ADMA</option><option value="client">Заказчик</option></select></label>
      <label class="switch" id="reimbRow"><span>Заказчик должен компенсировать</span><input id="eReimburse" type="checkbox" checked></label>
      <label>Комментарий<textarea id="eComment" rows="3"></textarea></label>
      <label>Фото чека<input id="eReceipt" type="file" accept="image/*"></label>
      <img id="preview" class="receipt" style="display:none">
    </form>
  </dialog>
  <dialog id="detailDlg"><div id="detail" class="dialog-body"></div></dialog>
  <script src="auth.js?v=20"></script>
  <script src="app.js?v=20"></script>
  <script src="cloud.js?v=20"></script>
</body>
</html>
