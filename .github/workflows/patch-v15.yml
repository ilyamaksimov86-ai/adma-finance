name: Patch v15
on:
  push:
    paths:
      - '.github/workflows/patch-v15.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v15 patch
        run: python .github/scripts/patch_v15.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add project editing and archive v15"
          git push
