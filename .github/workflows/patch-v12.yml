name: Patch v12
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch_v12.py
      - run: |
          rm .github/workflows/patch-v12.yml
          rm .github/scripts/patch_v12.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use XHR receipt upload and fix expense actions layout"
          git push
