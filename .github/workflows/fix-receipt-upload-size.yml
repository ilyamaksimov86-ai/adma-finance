name: Fix receipt upload size
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-receipt-upload-size.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce receipt payload and bump cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloud.js')
          s=p.read_text()
          s=s.replace('const max = 1800;', 'const max = 1000;')
          s=s.replace("resolve(canvas.toDataURL('image/jpeg', 0.8));", "resolve(canvas.toDataURL('image/jpeg', 0.58));")
          p.write_text(s)
          i=Path('index.html')
          x=i.read_text()
          import re
          x=re.sub(r'cloud\\.js\\?v=\\d+', 'cloud.js?v=3', x)
          i.write_text(x)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.js index.html
          git diff --cached --quiet || git commit -m "Reduce receipt upload payload"
          git push
