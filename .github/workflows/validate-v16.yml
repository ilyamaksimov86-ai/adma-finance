name: Validate v16

on:
  push:
    paths:
      - '.github/workflows/validate-v16.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check cloud.js syntax
        run: node --check cloud.js
      - name: Check v16 wiring
        run: |
          grep -q 'PDF_EXPORT_V16' cloud.js
          grep -q 'renderDue = renderDueCloud' cloud.js
          grep -q 'reimbursement-pdf' cloud.js
          grep -q 'cloud.js?v=16' index.html
