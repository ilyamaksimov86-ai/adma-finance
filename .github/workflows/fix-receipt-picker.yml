name: Fix receipt picker

on:
  push:
    paths:
      - '.github/workflows/fix-receipt-picker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow photo library / file picker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'type="file" accept="image/*" capture="environment"'
          new = 'type="file" accept="image/*"'
          if old not in s:
              print('Already fixed')
          else:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ADMA Finance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Allow selecting receipt photos from library"
          git push
