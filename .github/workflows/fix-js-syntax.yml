name: Fix JS syntax
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-js-syntax.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix missing semicolon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("},{passive:false})const cats=", "},{passive:false});const cats=")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix JavaScript syntax"
          git push
