name: Bump cloud cache v6
on:
  push:
    paths:
      - '.github/workflows/bump-cloud-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'cloud.js?v=5'
          new = 'cloud.js?v=6'
          if old not in s:
              raise SystemExit('cloud v5 reference not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump cloud cache to v6" || exit 0
          git push
