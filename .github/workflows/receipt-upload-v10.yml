name: Receipt upload v10
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch_receipt_v10.py
      - run: |
          rm .github/workflows/receipt-upload-v10.yml
          rm .github/scripts/patch_receipt_v10.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild receipt upload through multipart edge function"
          git push
