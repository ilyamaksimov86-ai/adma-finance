name: Receipt upload v11
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/receipt-upload-v11.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch_receipt_v11.py
      - run: |
          rm .github/workflows/receipt-upload-v11.yml
          rm .github/scripts/patch_receipt_v11.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve receipt upload and restore delete button"
          git push
