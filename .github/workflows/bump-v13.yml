name: Bump v13 cache
on:
  push:
    paths:
      - '.github/scripts/bump_v13.py'
      - '.github/workflows/bump-v13.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/bump_v13.py
      - run: rm .github/workflows/bump-v13.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/bump-v13.yml
          git commit -m "Bump cloud.js to v13" || exit 0
          git push
