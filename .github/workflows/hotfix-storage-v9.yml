name: hotfix-storage-v9
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path
          p=Path('cloud.js')
          s=p.read_text()
          old=base64.b64decode(os.environ['OLD_B64']).decode()
          new=base64.b64decode(os.environ['NEW_B64']).decode()
          if old not in s:
              raise SystemExit('uploader target not found')
          p.write_text(s.replace(old,new,1))
          i=Path('index.html')
          h=i.read_text()
          h2,n=re.subn(r'cloud\.js\?v=\d+','cloud.js?v=9',h,count=1)
          if n!=1:
              raise SystemExit('cache ref not found')
          i.write_text(h2)
          PY
      - name: Commit
        run: |
          rm .github/workflows/hotfix-storage-v9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use direct signed Storage upload v9"
          git push
